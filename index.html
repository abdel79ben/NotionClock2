<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;

        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
    }

    .clock-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    /* TIME */
    .time {
        color: #1F2937;
        font-size: 52px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 1px;
        white-space: nowrap;
    }

    /* DATE */
    .date {
        color: #6B7280;
        font-size: 14px;
        font-weight: 400;
        margin-top: 7px;
        line-height: 1.2;
        white-space: nowrap;
    }

    /* Smaller screens */
    @media (max-width: 600px) {
        .time {
            font-size: 42px;
        }

        .date {
            font-size: 13px;
        }
    }
</style>
</head>

<body>

<div class="clock-container">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">Thursday, September 17, 2026</div>
</div>

<script>

function updateClock() {

    const now = new Date();

    // Time — 24 hour format, no seconds
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');

    document.getElementById("time").textContent =
        `${hours}:${minutes}`;

    // Date
    const dateOptions = {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric'
    };

    document.getElementById("date").textContent =
        now.toLocaleDateString('en-US', dateOptions);
}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
